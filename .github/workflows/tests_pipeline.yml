name: TestsPipeline
on:
  push:
    branches:
      - 'experiment/**'
      - 'release/**'
      - 'main'
  pull_request:
    branches:
      - main
      - 'release/**'
concurrency:
  group: TestsPipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:

  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '22', '24' ]
    name: ${{ matrix.platform }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
        timeout-minutes: 5
      - name: Verify ESLint
        run: npm run lint
      - run: echo "✅ All checks passed on ${{ matrix.platform }} with Node ${{ matrix.node }}"

  bun-runtime:
    name: Bun ${{ matrix.bun }} - ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
        bun: [ '1.4.4' ]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Run tests under Bun
        run: bun run test
      - name: Verify ESLint
        run: bun run lint
      - name: Run Bun runner tests
        run: bun --bun playwright test
        timeout-minutes: 5
      - run: echo "✅ Bun runtime checks passed on ${{ matrix.platform }}"
